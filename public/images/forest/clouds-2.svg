<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="cloudBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#cloudBlur)" fill="#ffffff" opacity="0.5">
    <ellipse cx="400" cy="350" rx="100" ry="40" />
    <ellipse cx="500" cy="330" rx="70" ry="35" />
    <ellipse cx="300" cy="340" rx="50" ry="25" />
    <ellipse cx="800" cy="300" rx="90" ry="35" />
    <ellipse cx="900" cy="280" rx="60" ry="30" />
    <ellipse cx="700" cy="290" rx="45" ry="25" />
    <ellipse cx="1200" cy="330" rx="100" ry="40" />
    <ellipse cx="1300" cy="310" rx="70" ry="35" />
    <ellipse cx="1100" cy="320" rx="55" ry="30" />
    <ellipse cx="1600" cy="280" rx="90" ry="40" />
    <ellipse cx="1700" cy="260" rx="60" ry="30" />
    <ellipse cx="1500" cy="270" rx="50" ry="25" />
  </g>
</svg>