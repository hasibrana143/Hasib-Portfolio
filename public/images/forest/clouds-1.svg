<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="cloudBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#cloudBlur)" fill="#ffffff" opacity="0.7">
    <ellipse cx="200" cy="200" rx="120" ry="50" />
    <ellipse cx="300" cy="180" rx="80" ry="40" />
    <ellipse cx="100" cy="190" rx="60" ry="35" />
    <ellipse cx="600" cy="150" rx="100" ry="45" />
    <ellipse cx="700" cy="130" rx="70" ry="35" />
    <ellipse cx="500" cy="140" rx="50" ry="30" />
    <ellipse cx="1000" cy="180" rx="90" ry="40" />
    <ellipse cx="1100" cy="160" rx="60" ry="30" />
    <ellipse cx="1400" cy="120" rx="110" ry="50" />
    <ellipse cx="1500" cy="100" rx="80" ry="40" />
    <ellipse cx="1300" cy="130" rx="60" ry="35" />
    <ellipse cx="1750" cy="160" rx="90" ry="40" />
    <ellipse cx="1850" cy="140" rx="60" ry="30" />
  </g>
</svg>